name: Feature request
description: Suggest an improvement to the configuration or its documentation.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem and keep suggestions relevant to this Continue/Ollama configuration.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or difficulty are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like and why it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds you have considered.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I checked that this suggestion is not already covered by an open issue.
          required: true
        - label: I have not included secrets or sensitive information.
          required: true
