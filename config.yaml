name: Ollama Code Assistant
version: 1.0.0
schema: v1
models:
  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://localhost:11434
    roles:
      - autocomplete
  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed
  - name: BGE Reranker v2 M3
    provider: ollama
    model: qllama/bge-reranker-v2-m3:latest
    apiBase: http://localhost:11434
    roles:
      - rerank
  - name: Qwen2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    contextLength: 16384
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
context:
  - provider: codebase
  - provider: diff
  - provider: terminal
  - provider: docs
  - provider: file
rules:
  - Follow the existing codebase conventions and architecture.
  - Make the smallest complete change that solves the requested problem.
  - Preserve existing behavior and public interfaces unless a change is requested.
  - Prefer clear, maintainable, and appropriately tested solutions over cleverness.
  - Use existing dependencies and APIs; do not invent libraries, methods, or behavior.
  - Validate untrusted input and handle errors explicitly at appropriate boundaries.
  - Never expose credentials, secrets, or sensitive data in code or logs.
  - Use the language and type-system features already established by the project.
  - Add or update focused tests when changing behavior, and run relevant checks.
  - Ask for clarification when requirements are ambiguous and materially affect the solution.
  - Keep explanations concise and mention assumptions and validation results.
