name: Ollama Code Assistant
version: 1.0.0
schema: v1
models:
  - name: Qwen2.5-Coder 1.5B
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://localhost:11434
    roles:
      - autocomplete
  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed
  - name: BGE Reranker v2 M3
    provider: ollama
    model: qllama/bge-reranker-v2-m3:latest
    apiBase: http://localhost:11434
    roles:
      - rerank
  - name: Qwen2.5-Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b-instruct-q4_K_M
    apiBase: http://localhost:11434
    contextLength: 16384
    roles:
      - chat
      - edit
      - apply
context:
  - provider: codebase
  - provider: diff
  - provider: terminal
  - provider: docs
  - provider: file
rules:
  - "Follow the conventions of the file being edited: language, formatting, naming, imports, error handling."
  - "Make the smallest complete change: no unrelated refactoring or reformatting; keep existing behavior and public interfaces unless asked."
  - Use only dependencies and APIs that exist in the project; if something is missing from the context, say so instead of inventing it.
  - Add or update focused tests when behavior changes. Never claim that a command, test, or check was run unless it was.
  - "When asked to change code, return only the resulting code or diff: no preamble, no restating the request."
  - If a requirement is ambiguous, state the assumption you made and proceed; ask only when the choice is irreversible.
  - Never place credentials, secrets, or tokens in code, logs, or error messages.
  - name: input-validation
    rule: Validate untrusted input at boundaries and fail explicitly.
    globs:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.go"
